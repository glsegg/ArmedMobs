modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Armed Mobs"
logoFile="armedmobs-logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The normal jar requires an installed GeckoLib. Only the optional jarJar build embeds it.
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

# TaCZ is OPTIONAL since 2026-10 (README 5ac) and is deliberately NOT bundled: it is a 57 MB third-party
# mod that the player installs themselves. WITH TaCZ every unit is issued a firearm; WITHOUT it the mod
# still loads and the same units fight with bows and crossbows (see TaczPresence/FallbackEquipment), so
# this entry is mandatory=false on purpose - a pack without TaCZ must load rather than be refused.
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="${tacz_version_range}"
    ordering="AFTER"
    side="BOTH"
