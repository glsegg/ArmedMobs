# Gradle
# A bounded heap keeps ForgeGradle's MCP pipeline (which resolves hundreds of jars) from
# ballooning; an uncapped JVM has pushed past 13 GB on this machine before.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m
# Keep the worker pool small: the MCP steps are memory hogs, not CPU bound.
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.caching=true
# Native file-system watching crashes on some Windows setups ("Couldn't open current thread").
org.gradle.vfs.watch=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties
# mod_id is the INTERNAL identity and must never change: existing worlds, structure ids, block/NBT
# tags and the tuned config all reference "tarkovscav". The display name is "Armed Mobs" and the
# shipped jar is armedmobs-<version> (mod_jar_name) - display-only rebranding, byte-compatible save.
mod_id=tarkovscav
mod_name=Armed Mobs
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.gfl.tarkovscav
mod_authors=Armed Mobs Mod Team
mod_description=Gun-armed thugs, pillagers and villagers that fight with TaCZ (Timeless and Classics Zero) firearms, spawning only inside city areas. Built on GeckoLib.
# The built artifact name. Kept apart from mod_id on purpose: the id stays tarkovscav (save safety),
# while the jars the user sees are armedmobs-<version>.jar / armedmobs-<version>-all.jar.
mod_jar_name=armedmobs

## Bundled dependency (GeckoLib)
# GeckoLib version embedded into the shipped jar (the jarJar pin).
geckolib_bundled_version=4.8.4
# Range declared in the jarJar metadata: an installed GeckoLib older than this loses to the bundled one.
geckolib_bundled_range=[4.8.4,)
# mods.toml requirement: deliberately wide, the sources are verified to compile against 4.7 - 4.8.4.
geckolib_version_range=[4.7,)

## External hard dependency (TaCZ) - NEVER bundled, never reobfuscated into this jar.
# The jar itself is not in the repository (it is a 57 MB third-party mod); see libs/README.md.
# libs/ is declared as a flatDir repository, so these two properties have to describe the FILE NAME:
# the resolver looks for libs/<tacz_module>-<tacz_version>.jar
tacz_module=tacz
tacz_version=1.20.1-1.1.8-hotfix
# mods.toml requirement. 1.1.7 and 1.1.8 both expose the API this mod uses.
tacz_version_range=[1.1.7,)
